services:
  sprints-ai-api:
    build: .
    container_name: sprints_ai_service
    ports:
      - "8000:8000"
    volumes:
      - ./data:/app/data
      - ./models:/app/models
      - ./database:/app/database
    environment:
      - PYTHONUNBUFFERED=1
      - SPRINTS_API_KEY=sprints-capstone-secret-api-key-2026
    restart: unless-stopped

  sprints-n8n:
    image: n8nio/n8n:2.47.2
    container_name: sprints_n8n_orchestrator
    ports:
      - "5678:5678"
    environment:
      - N8N_HOST=localhost
      - N8N_PORT=5678
      - N8N_PROTOCOL=http
      - WEBHOOK_URL=http://localhost:5678/
      - FASTAPI_BASE_URL=http://sprints-ai-api:8000
      - FASTAPI_API_KEY=sprints-capstone-secret-api-key-2026
      - GENERIC_TIMEZONE=Africa/Cairo
      - N8N_DIAGNOSTICS_ENABLED=false
      - N8N_VERSION_NOTIFICATIONS_ENABLED=false
      - N8N_ENFORCE_SETTINGS_FILE_PERMISSIONS=true
    volumes:
      - n8n_data:/home/node/.n8n
      - ./n8n_workflows:/workflows:ro
      - ./database:/app/database
    depends_on:
      - sprints-ai-api
    restart: unless-stopped

volumes:
  n8n_data:
