name: Sprints AI Agent CI Pipeline

on:
  push:
    branches: [ main ]
  pull_request:
    branches: [ main ]
  workflow_dispatch:

jobs:
  test-and-validate:
    name: Build, Test & Verify
    runs-on: ubuntu-latest

    steps:
      - name: Checkout Repository
        uses: actions/checkout@v4

      - name: Set up Python 3.10
        uses: actions/setup-python@v5
        with:
          python-version: "3.10"
          cache: "pip"

      - name: Set up Node.js 20
        uses: actions/setup-node@v4
        with:
          node-version: "20"

      - name: Install Python Dependencies
        run: |
          python -m pip install --upgrade pip
          pip install -r requirements.txt
          python -m spacy download en_core_web_sm
          python -c "import nltk; nltk.download('punkt'); nltk.download('punkt_tab'); nltk.download('stopwords')"

      - name: Sprint 1 - Relational Database & SQL Verification
        run: |
          python scripts/test_db.py

      - name: Sprint 2 & 3 - Modular Feature Parity Unit Tests
        run: |
          python tests/test_feature_parity.py

      - name: Sprint 4 - n8n Workflow Engine & JavaScript Code Verification
        run: |
          node tests/test_n8n_workflow_engine.js

      - name: Multi-Container Docker Compose Spec Validation
        run: |
          docker compose config

      - name: Sprint 4 - End-to-End API Integration & Latency SLA Verification
        run: |
          python scripts/test_api_and_n8n.py
