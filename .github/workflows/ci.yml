name: Sprints AI Agent CI Pipeline

on:
  push:
    branches: [ main ]
  pull_request:
    branches: [ main ]
  workflow_dispatch:

jobs:
  test-and-validate:
    name: Build, Test & Verify
    runs-on: ubuntu-latest

    steps:
      - name: Checkout Repository
        uses: actions/checkout@v4

      - name: Set up Python 3.10
        uses: actions/setup-python@v5
        with:
          python-version: "3.10"
          cache: "pip"

      - name: Set up Node.js 20
        uses: actions/setup-node@v4
        with:
          node-version: "20"

      - name: Install Python Dependencies
        run: |
          python -m pip install --upgrade pip
          pip install -r requirements.txt
          python -m spacy download en_core_web_sm
          python -c "import nltk; nltk.download('punkt'); nltk.download('punkt_tab'); nltk.download('stopwords')"

      - name: Sprint 1 - Relational Database & SQL Verification
        run: |
          python scripts/test_db.py

      - name: Sprint 2 & 3 - Modular Feature Parity Unit Tests
        run: |
          python tests/test_feature_parity.py

      - name: Sprint 4 - n8n Workflow Engine & JavaScript Code Verification
        run: |
          node tests/test_n8n_workflow_engine.js

      - name: Multi-Container Docker Compose Spec Validation
        run: |
          docker compose config

      - name: Sprint 4 - End-to-End API Integration & Latency SLA Verification
        run: |
          python scripts/test_api_and_n8n.py

      - name: Spin up Live Docker Multi-Container Stack (FastAPI + n8n)
        run: |
          docker compose up --build -d
          echo "Waiting for live services to report healthy..."
          timeout 60 bash -c 'until curl -s http://localhost:8000/api/v1/health | grep -q healthy; do sleep 2; done'
          timeout 60 bash -c 'until curl -s -o /dev/null -w "%{http_code}" http://localhost:5678 | grep -E "200|302|401"; do sleep 3; done'
          sleep 5
          echo "Importing n8n workflow..."
          docker exec sprints_n8n_orchestrator n8n import:workflow --input=/workflows/learner_success_agent.json || true
          echo "Publishing n8n workflow..."
          docker exec sprints_n8n_orchestrator n8n publish:workflow --id=sprints-capstone-n8n-workflow || true
          docker exec sprints_n8n_orchestrator sh -c 'n8n export:workflow --all --output=/tmp/wfs.json && node -e "const fs=require(\"fs\"); const {execSync}=require(\"child_process\"); const d=JSON.parse(fs.readFileSync(\"/tmp/wfs.json\",\"utf8\")); (Array.isArray(d)?d:[d]).forEach(w => { if(w.id){ try{execSync(\"n8n publish:workflow --id=\" + w.id, {stdio:\"ignore\"})}catch(e){} try{execSync(\"n8n update:workflow --id=\" + w.id + \" --active=true\", {stdio:\"ignore\"})}catch(e){} } })"' || true
          echo "Restarting n8n container to register webhooks from database into router..."
          docker restart sprints_n8n_orchestrator
          timeout 60 bash -c 'until curl -s -o /dev/null -w "%{http_code}" http://localhost:5678 | grep -E "200|302|401"; do sleep 3; done'
          sleep 5
          echo "Verifying live webhook readiness..."
          timeout 30 bash -c 'until [ $(curl -s -o /dev/null -w "%{http_code}" -X POST http://localhost:5678/webhook/learner-query -H "Content-Type: application/json" -d "{\"learner_id\":\"LRN-1002\",\"query_text\":\"ping\"}") -ne 404 ]; do sleep 2; done' || true
          docker compose ps

      - name: Live n8n Docker Webhook Integration Tests (Dual Branch Routing & SQLite Persistence)
        run: |
          python tests/test_n8n_docker_integration.py --require-live

      - name: Teardown Docker Stack
        if: always()
        run: |
          docker compose down -v
