name: Sprints AI Agent CI Pipeline

on:
  push:
    branches: [ main ]
  pull_request:
    branches: [ main ]
  workflow_dispatch:

jobs:
  test-and-validate:
    name: Build, Test & Verify
    runs-on: ubuntu-latest
    env:
      SPRINTS_API_KEY: ${{ secrets.SPRINTS_API_KEY || 'sk_ci_test_sprints_4e8a2b1c6d9f3e5a7b0c2d4e6f8a' }}
      FASTAPI_API_KEY: ${{ secrets.SPRINTS_API_KEY || 'sk_ci_test_sprints_4e8a2b1c6d9f3e5a7b0c2d4e6f8a' }}
      WEBHOOK_SECRET: whsec_ci_test_sprints_e8a7b6c5d4e3f2a1b0c9d8e7f6a5b4c3
      SESSION_SECRET: sess_ci_test_sprints_f9e8d7c6b5a4f3e2d1c0b9a8f7e6d5c4
      MAX_PAYLOAD_SIZE: 65536

    steps:
      - name: Checkout Repository
        uses: actions/checkout@v4

      - name: Set up Python 3.10
        uses: actions/setup-python@v5
        with:
          python-version: "3.10"
          cache: "pip"

      - name: Set up Node.js 20
        uses: actions/setup-node@v4
        with:
          node-version: "20"

      - name: Install Python Dependencies
        run: |
          python -m pip install --upgrade pip
          pip install -r requirements.txt
          python -m spacy download en_core_web_sm
          python -c "import nltk; nltk.download('punkt'); nltk.download('punkt_tab'); nltk.download('stopwords')"

      - name: Sprint 1 - Relational Database & SQL Verification
        run: |
          python scripts/test_db.py

      - name: Sprint 2 & 3 - Modular Feature Parity Unit Tests
        run: |
          python tests/test_feature_parity.py

      - name: Phase 2 - ML / DL Scientific Validation & Baseline Benchmarks (MLP, LSTM, ROC, Calibration)
        run: |
          python scripts/evaluate_benchmarks.py
          python -m pytest -v tests/test_ml_dl_validation.py

      - name: Phase 3 - Egyptian Arabic NLP & Semantic Vector RAG Pipeline (Confusion Matrix, Polysemy, OOV Fallback)
        run: |
          python scripts/evaluate_nlp_benchmarks.py
          python -m pytest -v tests/test_nlp_rag_evaluation.py

      - name: Phase 4 - End-to-End Orchestration & Failure Recovery (DB Resilience, 20-Thread Race Condition)
        run: |
          python -m pytest -v tests/test_e2e_resilience_and_failures.py

      - name: Phase 5 - Multi-Tier Concurrency & Scalability Benchmark (10 to 100 Workers)
        run: |
          python scripts/evaluate_performance_scalability.py

      - name: Sprint 4 - Egyptian Arabic Dialect NLP & Distress Metrics (P/R/F1 >= 0.90)
        run: |
          python -m pytest -v tests/test_arabic_nlp_metrics.py

      - name: Sprint 4 - Idempotency Key, Concurrent Deduplication & Correlation ID Tracing
        run: |
          python -m pytest -v tests/test_idempotency_and_retry.py

      - name: Sprint 4 - API Security, X-API-Key Authentication & Rate Limiting
        run: |
          python -m pytest -v tests/test_security_and_auth.py

      - name: Phase 1 - Enterprise Security Hardening (HMAC Webhooks, Replay Defense, Payload 413, Sessions)
        run: |
          python -m pytest -v tests/test_security_hardening.py

      - name: Sprint 4 - Concurrency & Empirical Latency SLA Benchmark
        run: |
          python -m pytest -v tests/test_latency_under_load.py

      - name: Sprint 4 - Live Interactive Dashboard End-to-End Verification
        run: |
          python -m pytest -v tests/test_dashboard_e2e.py

      - name: Sprint 4 - n8n Workflow Engine & JavaScript Code Verification
        run: |
          node tests/test_n8n_workflow_engine.js

      - name: Multi-Container Docker Compose Spec Validation
        run: |
          docker compose config

      - name: Sprint 4 - End-to-End API Integration & Latency SLA Verification
        run: |
          python scripts/test_api_and_n8n.py

      - name: Spin up Live Docker Multi-Container Stack (FastAPI + n8n)
        run: |
          docker compose up --build -d
          echo "Waiting for live services to report healthy..."
          timeout 60 bash -c 'until curl -s http://localhost:8000/api/v1/health | grep -q healthy; do sleep 2; done'
          timeout 60 bash -c 'until curl -s -o /dev/null -w "%{http_code}" http://localhost:5678 | grep -E "200|302|401"; do sleep 3; done'
          sleep 5
          echo "Importing n8n workflow..."
          docker exec sprints_n8n_orchestrator n8n import:workflow --input=/workflows/learner_success_agent.json
          echo "Publishing n8n workflow..."
          docker exec sprints_n8n_orchestrator n8n publish:workflow --id=sprints-capstone-n8n-workflow
          echo "Restarting n8n container to register webhooks from database into router..."
          docker restart sprints_n8n_orchestrator
          timeout 60 bash -c 'until curl -s -o /dev/null -w "%{http_code}" http://localhost:5678 | grep -E "200|302|401"; do sleep 3; done'
          sleep 5
          echo "Verifying live webhook readiness and full end-to-end execution (HTTP 200 OK)..."
          timeout 60 bash -c 'until [ $(curl -s -o /tmp/webhook_probe.json -w "%{http_code}" -X POST http://localhost:5678/webhook/learner-query -H "Content-Type: application/json" -d "{\"learner_id\":\"LRN-1002\",\"query_text\":\"What is relational SQL?\"}") -eq 200 ]; do echo "Awaiting webhook readiness..."; sleep 3; done'
          docker compose ps

      - name: Live n8n Docker Webhook Integration Tests (Dual Branch Routing & SQLite Persistence)
        run: |
          python tests/test_n8n_docker_integration.py --require-live

      - name: Teardown Docker Stack
        if: always()
        run: |
          docker compose down -v
