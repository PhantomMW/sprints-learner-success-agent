# ==============================================================================
# SPRINTS AI-POWERED LEARNER SUCCESS AGENT
# Production Reverse Proxy Configuration (Nginx Enterprise)
# TLS 1.3, Hardened SSL Ciphers, HSTS, Rate Limiting & Private Proxy Pass
# ==============================================================================

user nginx;
worker_processes auto;
error_log /var/log/nginx/error.log warn;
pid /var/run/nginx.pid;

events {
    worker_connections 2048;
    use epoll;
    multi_accept on;
}

http {
    include /etc/nginx/mime.types;
    default_type application/octet-stream;

    log_format main_json escape=json '{'
        '"time_local":"$time_local",'
        '"remote_addr":"$remote_addr",'
        '"request":"$request",'
        '"status": "$status",'
        '"body_bytes_sent":"$body_bytes_sent",'
        '"request_time":"$request_time",'
        '"http_referrer":"$http_referer",'
        '"http_user_agent":"$http_user_agent",'
        '"http_x_correlation_id":"$http_x_correlation_id"'
    '}';

    access_log /var/log/nginx/access.log main_json;

    # Performance optimizations
    sendfile on;
    tcp_nopush on;
    tcp_nodelay on;
    keepalive_timeout 65;
    types_hash_max_size 2048;
    server_tokens off;

    # Buffer & Payload Protection (64 KB ceiling matching microservice MAX_PAYLOAD_SIZE)
    client_max_body_size 64k;
    client_body_buffer_size 64k;

    # Rate Limiting Zones (Defense-in-depth in front of FastAPI)
    limit_req_zone $binary_remote_addr zone=api_limit:10m rate=120r/m;
    limit_req_zone $binary_remote_addr zone=webhook_limit:10m rate=60r/m;

    # Upstream Microservice Clusters
    upstream fastapi_backend {
        server sprints-ai-api:8000 max_fails=3 fail_timeout=10s;
        keepalive 32;
    }

    upstream n8n_orchestrator {
        server sprints-n8n:5678 max_fails=3 fail_timeout=10s;
        keepalive 16;
    }

    # HTTP Redirect to HTTPS
    server {
        listen 80;
        listen [::]:80;
        server_name _;

        location /.well-known/acme-challenge/ {
            root /var/www/certbot;
        }

        location / {
            return 301 https://$host$request_uri;
        }
    }

    # Hardened HTTPS Server (TLS 1.2 & TLS 1.3 only)
    server {
        listen 443 ssl http2;
        listen [::]:443 ssl http2;
        server_name _;

        # SSL Certificates (managed via Certbot or custom mount)
        ssl_certificate /etc/letsencrypt/live/sprints.ai/fullchain.pem;
        ssl_certificate_key /etc/letsencrypt/live/sprints.ai/privkey.pem;

        # TLS Protocols & High-Security Ciphers
        ssl_protocols TLSv1.2 TLSv1.3;
        ssl_ciphers 'ECDHE-ECDSA-AES128-GCM-SHA256:ECDHE-RSA-AES128-GCM-SHA256:ECDHE-ECDSA-AES256-GCM-SHA384:ECDHE-RSA-AES256-GCM-SHA384:DHE-RSA-AES128-GCM-SHA256:DHE-RSA-AES256-GCM-SHA384';
        ssl_prefer_server_ciphers off;

        # SSL Session Cache
        ssl_session_timeout 1d;
        ssl_session_cache shared:SSL:10m;
        ssl_session_tickets off;

        # Security Headers
        add_header Strict-Transport-Security "max-age=31536000; includeSubDomains; preload" always;
        add_header X-Content-Type-Options "nosniff" always;
        add_header X-Frame-Options "DENY" always;
        add_header Referrer-Policy "strict-origin-when-cross-origin" always;
        add_header Permissions-Policy "geolocation=(), microphone=(), camera=()" always;

        # API Endpoints (FastAPI Backend)
        location /api/ {
            limit_req zone=api_limit burst=20 nodelay;
            proxy_pass http://fastapi_backend;
            proxy_http_version 1.1;
            proxy_set_header Connection "";
            proxy_set_header Host $host;
            proxy_set_header X-Real-IP $remote_addr;
            proxy_set_header X-Forwarded-For $proxy_add_x_forwarded_for;
            proxy_set_header X-Forwarded-Proto $scheme;
            proxy_read_timeout 10s;
        }

        # OpenAPI Documentation & Root Dashboard
        location ~ ^/(docs|openapi.json|$)$ {
            proxy_pass http://fastapi_backend;
            proxy_http_version 1.1;
            proxy_set_header Connection "";
            proxy_set_header Host $host;
            proxy_set_header X-Real-IP $remote_addr;
            proxy_set_header X-Forwarded-For $proxy_add_x_forwarded_for;
            proxy_set_header X-Forwarded-Proto $scheme;
        }

        # Webhook Ingestion (n8n Orchestrator)
        location /webhook/ {
            limit_req zone=webhook_limit burst=10 nodelay;
            proxy_pass http://n8n_orchestrator;
            proxy_http_version 1.1;
            proxy_set_header Connection "";
            proxy_set_header Host $host;
            proxy_set_header X-Real-IP $remote_addr;
            proxy_set_header X-Forwarded-For $proxy_add_x_forwarded_for;
            proxy_set_header X-Forwarded-Proto $scheme;
            proxy_read_timeout 15s;
        }
    }
}
